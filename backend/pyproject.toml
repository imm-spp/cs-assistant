[project]
name = "cs-assistant-backend"
version = "0.1.0"
description = "Backend ของ CS Assistant — ผู้ช่วย AI สำหรับทีมดูแลลูกค้า"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi[standard]>=0.115",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "faker>=40.44.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ollama: เทสต์ที่เรียก Ollama จริง (รันด้วย pytest -m ollama)",
]
addopts = "-m 'not ollama'"
