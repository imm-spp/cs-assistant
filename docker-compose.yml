services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs  # รหัสสำหรับเครื่อง dev เท่านั้น
      POSTGRES_DB: cs_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs -d cs_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
